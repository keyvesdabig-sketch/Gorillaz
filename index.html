<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorillaz Neo-Retro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    
    <div id="ui-layer">
      <div class="hud-top">
        <div class="player-stats" id="p0-stats">
          <div class="player-name">Player 1</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="p0-hp"></div>
          </div>
        </div>
        <div class="player-stats" id="p1-stats">
          <div class="player-name align-right">AI</div>
          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="p1-hp"></div>
          </div>
        </div>
      </div>

      <div class="wind-indicator">
        <div class="wind-label">Wind Velocity</div>
        <div class="wind-arrow-container">
          <div class="wind-arrow-line" id="wind-line"></div>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="turn-info" id="turn-indicator">Player 1 Turn</div>
        <div class="aim-controls" id="aim-ui">
          <div class="control-item">
            <div class="control-label">Angle</div>
            <div class="control-value"><span id="angle-val">45</span>°</div>
          </div>
          <div class="control-item">
            <div class="control-label">Power</div>
            <div class="control-value" id="power-val">50</div>
          </div>
        </div>
      </div>
    </div>

    <div id="game-over-overlay">
      <div class="winner-text" id="winner-name">WINNER</div>
      <div class="restart-text">Press SPACE to Restart</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
